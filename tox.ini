[tox]
envlist =
    py{312,313,314}-{linux,macos,windows}
    py312-linux-scanpy{111,112}
    py313-linux-scanpy113
isolated_build=true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
deps =
    pytest
    pytest-xdist
    pytest-cov
    pytest-qt
    pytest-mock
    scanpy111: scanpy>=1.11,<1.12
    scanpy112: scanpy>=1.12,<1.13
    scanpy113: scanpy>=1.13,<1.14
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras =
    test
    docs
    all
    pre
commands = pytest -v --color=yes --cov=napari_spatialdata --cov-report=xml
